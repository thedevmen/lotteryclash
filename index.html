<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottery Clash — Coming soon</title>
<meta name="description" content="Lottery Clash is coming soon.">
<meta name="theme-color" content="#2a1012">

<meta property="og:type" content="website">
<meta property="og:url" content="https://lotteryclash.com/">
<meta property="og:title" content="Lottery Clash — Coming soon">
<meta property="og:description" content="Lottery Clash is coming soon.">
<meta property="og:image" content="https://lotteryclash.com/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lottery Clash — Coming soon">
<meta name="twitter:description" content="Lottery Clash is coming soon.">
<meta name="twitter:image" content="https://lotteryclash.com/assets/img/og.jpg">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/img/bg.webp" fetchpriority="high">

<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#2a1012;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .stage{position:fixed;inset:0;overflow:hidden}

  /* Scenery. Cropping it costs nothing, so it simply fills whatever shape the screen is. */
  .bg{
    position:absolute;inset:0;
    background:url(/assets/img/bg.webp) center center/cover no-repeat;
  }

  /* The logo and the sign sit in the frame on their own, sized against the screen
     rather than against the scenery, so they stay readable at every shape.
     --w is the sign's width; everything else is a proportion of it. */
  .mark{
    --w:min(48vw, 37.8vh);
    position:absolute;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:calc(var(--w) * .09);
    opacity:0;
    transition:opacity .5s ease-out;
    will-change:opacity;
  }
  .mark.ready{opacity:1}

  .logo{width:calc(var(--w) * .80);height:auto;display:block}
  .sign{width:var(--w);height:auto;display:block}

  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  @media (prefers-reduced-motion:reduce){
    .mark{transition:none}
  }
</style>
</head>
<body>
  <h1 class="sr">Lottery Clash — coming soon</h1>
  <div class="stage">
    <div class="bg" role="img" aria-label="A desert at sunset"></div>
    <div class="mark">
      <img class="logo" src="/assets/img/logo.webp" width="390" height="375" alt="Lottery Clash" fetchpriority="high" decoding="async">
      <img class="sign" src="/assets/img/sign.webp" width="593" height="193" alt="Coming soon" fetchpriority="high" decoding="async">
    </div>
  </div>
<script>
  (function () {
    var mark = document.querySelector('.mark');
    var imgs = mark.querySelectorAll('img');
    var left = imgs.length;
    function done(){ if (--left === 0) mark.classList.add('ready'); }
    for (var i = 0; i < imgs.length; i++) {
      if (imgs[i].complete) { done(); }
      else { imgs[i].addEventListener('load', done, { once: true });
             imgs[i].addEventListener('error', done, { once: true }); }
    }
  })();
</script>
</body>
</html>
